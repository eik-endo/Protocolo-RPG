<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protocolo · Ficha 4ª Edição</title>
<style>
/* ===== PROTOCOLO 4ª ED — ESTILO ===== */
:root{--bg:#0f0d0b;--panel:#18140f;--panel2:#1f1a13;--line:#332a1e;--line2:#443826;--ink:#d9d2c2;--dim:#a29679;--faint:#6d6350;--gold:#b8932f;--goldim:#7c6524;--red:#8e2020;
--ec:#b8932f;--ecd:#7c6524;--eglow:rgba(184,147,47,.14);--band:0;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% -10%,var(--eglow),transparent 55%)}
#fx-canvas{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.5}
#fx-vign{position:fixed;inset:0;pointer-events:none;z-index:7;box-shadow:inset 0 0 calc(40px + var(--band)*34px) calc(var(--band)*7px) rgba(0,0,0,calc(.12 + var(--band)*.09));transition:box-shadow 1.2s}
#fx-blood{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;box-shadow:inset 0 0 120px 30px rgba(142,32,32,.55);transition:opacity .6s}
/* obs — escopofobia (piloto): olho na periferia, túnel de desfoque, flash de texto */
/* névoa periférica só com gradiente: nada de backdrop-filter — reprocessar o fundo a cada
   frame (as partículas ficam embaixo) era o que travava a ficha nas bandas altas */
#fx-tunnel{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;visibility:hidden;transition:opacity 1.6s,visibility 1.6s;
 background:radial-gradient(ellipse at 50% 45%,transparent 44%,rgba(0,0,0,calc(.03 + var(--band)*.045)) 82%,rgba(0,0,0,calc(.07 + var(--band)*.065)) 100%),
  radial-gradient(ellipse at 50% 45%,transparent 62%,var(--eglow) 100%)}
#fx-eye{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;visibility:hidden;transition:opacity 2.2s,visibility 2.2s;--eyeb:20px}
/* a difusão vem das paradas largas do gradiente; o blur fica pequeno e a caixa ganha camada
   própria, então ele é rasterizado uma vez e o resto do tempo só se translada na GPU */
#fx-eye i{position:absolute;left:0;top:0;width:46vmin;height:27vmin;margin:-13.5vmin 0 0 -23vmin;border-radius:50%;will-change:transform,opacity;transform:translate3d(-140vw,0,0);
 background:radial-gradient(closest-side at 50% 50%,#000 0 9%,var(--ecd) 22% 28%,var(--ec) 36% 42%,rgba(0,0,0,.55) 52% 58%,transparent 78%);filter:blur(var(--eyeb))}
.fx-flash{position:fixed;pointer-events:none;z-index:9;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
body.lowvida #fx-blood{opacity:1;animation:bloodpulse 2.2s ease-in-out infinite}
@keyframes bloodpulse{50%{box-shadow:inset 0 0 160px 46px rgba(142,32,32,.7)}}
body.lowluc .wrap{animation:lucshake 7s ease-in-out infinite}
@keyframes lucshake{0%,92%,100%{transform:none}94%{transform:translateX(1px) skewX(.12deg)}97%{transform:translateX(-1px)}}
#whisper{position:fixed;z-index:8;pointer-events:none;font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:2px;color:var(--ec);opacity:0;transition:opacity 2.4s;max-width:240px;text-shadow:0 0 8px var(--eglow)}
#whisper.on{opacity:calc(.28 + var(--band)*.1)}
.wrap{position:relative;z-index:5;max-width:1200px;margin:0 auto;padding:14px 16px 60px}
/* header */
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:8px}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:26px;letter-spacing:8px;margin:0;color:var(--ink)}
h1 b{color:var(--ec);font-weight:400}
.sub{font-size:10px;letter-spacing:4px;color:var(--faint);text-transform:uppercase}
.hbtns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button{cursor:pointer;font:inherit}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--dim);padding:6px 12px;border-radius:3px;font-size:12px;letter-spacing:.5px;transition:.18s}
.btn:hover{color:var(--ink);border-color:var(--ec)}
.btn.gold{border-color:var(--goldim);color:var(--gold)}
.btn.gold:hover{border-color:var(--ec);color:var(--ec)}
.btn.del{border-color:#4a2020;color:#b06a6a}.btn.del:hover{border-color:var(--red);color:#e08a8a}
.btn.mini{padding:2px 8px;font-size:11px}
.btn.on{border-color:var(--ec);color:var(--ec);background:rgba(0,0,0,.25)}
/* tabs */
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin:10px 0 16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--faint);padding:8px 13px;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;transition:.2s}
.tabs button:hover{color:var(--dim)}
.tabs button.active{color:var(--ec);border-bottom-color:var(--ec)}
.tabs .tglifo{font-size:14px;letter-spacing:0}
/* dívida dock */
#divDock{display:none;margin:0 0 12px;padding:7px 14px;border:1px solid #4a2020;background:rgba(142,32,32,.08);color:#c88;font-size:12px;letter-spacing:1px;border-radius:3px}
#divDock.on{display:block}
body[data-el="pac"] #divDock.on{animation:dockpulse 3s ease-in-out infinite;border-color:var(--ec)}
@keyframes dockpulse{50%{background:rgba(163,38,56,.18)}}
/* panels */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:14px;overflow:hidden}
.panel h2{font-family:Georgia,serif;font-weight:400;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--ec);margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
.panel h2 small{font-size:10px;letter-spacing:1px;color:var(--faint);text-transform:none;font-family:system-ui}
label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin:0 0 3px}
input[type=text],input[type=number],select,textarea{width:100%;background:#0c0a08;border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:3px;font:inherit;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ecd)}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row>div{flex:1;min-width:130px}
.hint{font-size:11px;color:var(--faint);line-height:1.5;margin-top:6px}
.rw{font-family:ui-monospace,Consolas,monospace;letter-spacing:3px;color:var(--ec);cursor:help;text-shadow:0 0 calc(var(--band)*2px) var(--eglow);filter:none}
body[data-band="3"] .rw,body[data-band="4"] .rw,body[data-band="5"] .rw{animation:rwjit 5s steps(2) infinite}
@keyframes rwjit{0%,96%{text-shadow:0 0 6px var(--eglow)}98%{text-shadow:-1px 0 var(--red),1px 0 var(--ec)}}
/* atributos */
.attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:700px){.attrs{grid-template-columns:repeat(2,1fr)}}
.attr{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px;text-align:center}
.attr .an{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.attr input{text-align:center;font-size:20px;font-family:Georgia,serif;border:none;background:none;color:var(--ink);margin:2px 0}
.attr .ad{font-size:9px;color:var(--faint);letter-spacing:.5px}
/* recursos */
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.rec{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:9px 11px}
.rec .rn{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.rec .rn b{color:var(--faint);font-weight:400}
.rec .rv{display:flex;align-items:center;gap:6px;margin-top:5px}
.rec .rv input{width:56px;text-align:center;font-size:17px;font-family:Georgia,serif;padding:3px}
.rec .rv .mx{color:var(--faint);font-size:13px}
.rec .rv .mx input{width:46px;text-align:center;font-size:13px;font-family:Georgia,serif;padding:2px 3px;color:var(--dim)}
.rec .rv .mx input::placeholder{color:var(--faint);opacity:1}
.rec .stp{background:none;border:1px solid var(--line2);color:var(--dim);width:24px;height:24px;border-radius:3px;line-height:1}
.rec .stp:hover{border-color:var(--ec);color:var(--ec)}
.bar{height:4px;background:#0c0a08;border-radius:2px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ec);transition:width .4s}
body[data-el="ger"] .bar i{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{filter:brightness(1.25)}}
/* ruído tracker */
.rtrack{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.rseg{width:22px;height:26px;border:1px solid var(--line2);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;cursor:pointer;transition:.15s;background:#0c0a08}
.rseg:nth-child(4n){margin-right:7px}
.rseg.on{border-color:var(--ec);color:var(--ec);background:var(--eglow);text-shadow:0 0 6px var(--eglow)}
.rseg:hover{border-color:var(--dim)}
/* perícias */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:4px 14px}
.skill{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:3px;font-size:12.5px;cursor:pointer;border:1px solid transparent;transition:.15s}
.skill:hover{background:var(--panel2);border-color:var(--line)}
.skill input[type=checkbox]{width:13px;height:13px;accent-color:var(--ec);cursor:pointer}
.skill .nm{flex:1;color:var(--dim)}
.skill.tr .nm{color:var(--ink)}
.skill .at{font-size:9px;color:var(--faint);letter-spacing:1px;text-transform:uppercase}
.skill .bn{font-family:Georgia,serif;color:var(--ec);min-width:26px;text-align:right}
.sgroup{grid-column:1/-1;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);padding:8px 0 3px;margin-top:2px}
/* chips condições */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:12px;padding:3px 11px;font-size:11px;color:var(--faint);cursor:pointer;transition:.15s;letter-spacing:.5px}
.chip:hover{color:var(--dim);border-color:var(--dim)}
.chip.on{border-color:var(--red);color:#d88;background:rgba(142,32,32,.12)}
/* cards de habilidade / magia / talento */
.hcard{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--ecd);border-radius:3px;padding:9px 12px;margin-bottom:8px}
.hcard .ht{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hcard .ht b{font-family:Georgia,serif;font-weight:400;font-size:14px;color:var(--ink);letter-spacing:.5px}
.tag{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ec);border:1px solid var(--ecd);border-radius:2px;padding:1px 6px}
.tag.dark{color:var(--faint);border-color:var(--line2)}
.tag.warn{color:#c66;border-color:#5a2a2a}
.tag.ok{color:#8fae6a;border-color:#42552e}
.hcard .hx{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.55}
.hcard .hx em{color:var(--ink);font-style:normal;font-weight:600}
.hcard .hsab{font-style:italic;opacity:.8;font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5}
.hcard .src{margin-left:auto;font-size:9px;letter-spacing:1px;color:var(--faint);text-transform:uppercase}
.hcard.locked{opacity:.55}
.hcard.regra{border-left-color:var(--red)}
.secband{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);padding:14px 0 5px;margin-bottom:10px}
.secband b{color:var(--ec);font-weight:400}
/* wallet */
.wallet{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:8px 14px;margin-bottom:12px;font-size:12px;color:var(--dim)}
.wallet b{font-family:Georgia,serif;font-size:16px;color:var(--ec);font-weight:400}
.wallet .neg b{color:#c66}
/* maestrias */
.mcard{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:11px 13px;margin-bottom:10px}
.mrail{display:flex;gap:5px;margin:8px 0}
.mst{flex:1;text-align:center;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);border:1px solid var(--line2);border-radius:2px;padding:4px 2px}
.mst.on{color:var(--ec);border-color:var(--ec);background:var(--eglow)}
.mst.next{border-style:dashed}
/* fardo chips */
.fchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ecd);border-radius:3px;padding:5px 11px;font-size:12px;color:var(--ink);background:var(--panel2);margin:0 6px 6px 0}
.fchip small{color:var(--faint);font-size:10px}
.fchip .x{color:var(--faint);cursor:pointer;padding:0 2px}.fchip .x:hover{color:var(--red)}
/* ===== SINTONIZAR ===== */
#sintwrap{position:relative;min-height:70vh;padding:20px 0 30px}
#sintwrap .fala{ text-align:center;font-size:11px;letter-spacing:3px;color:var(--faint);margin:6px 0 26px;animation:falabr 6s ease-in-out infinite}
@keyframes falabr{50%{opacity:.55}}
.elring{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;max-width:960px;margin:0 auto}
.elc{--c:#888;position:relative;width:255px;min-height:190px;background:linear-gradient(180deg,#16120d,#100d09);border:1px solid var(--line2);border-radius:5px;padding:20px 18px 16px;cursor:pointer;text-align:center;transition:transform .3s,border-color .3s,box-shadow .3s;overflow:hidden}
.elc:hover{transform:translateY(-6px) scale(1.02);border-color:var(--c);box-shadow:0 8px 40px -8px var(--c)}
.elc .eg{font-size:44px;color:var(--c);display:block;text-shadow:0 0 22px var(--c);transition:.3s}
.elc:hover .eg{transform:scale(1.12)}
.elc .en{font-family:Georgia,serif;font-size:17px;letter-spacing:5px;text-transform:uppercase;margin:10px 0 2px;color:var(--ink)}
.elc .ev{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--c)}
.elc .ef{font-size:11px;color:var(--faint);margin-top:10px;line-height:1.5;font-style:italic}
.elc.dim{opacity:.32;filter:grayscale(.7)}
.elc.dim:hover{opacity:.75;filter:none}
.elc.sel{border-color:var(--c);box-shadow:0 0 55px -10px var(--c);transform:scale(1.04)}
.elc.sel::after{content:"⟑⋏⊙⌖◊ sintonizado";position:absolute;top:8px;right:10px;font-size:8px;letter-spacing:2px;color:var(--c);font-family:ui-monospace,monospace}
@media(min-width:960px){.elring .elc:nth-child(1){transform:translateY(18px)}.elring .elc:nth-child(2){transform:translateY(-12px)}.elring .elc:nth-child(3){transform:translateY(10px)}.elring .elc:nth-child(4){transform:translateY(-6px)}.elring .elc:nth-child(5){transform:translateY(16px)}.elring .elc:nth-child(6){transform:translateY(-10px)}
.elring .elc:hover{transform:translateY(-8px) scale(1.03)}}
/* micro-temas nos cards */
.elc[data-el=obs]::before{content:"⊙";position:absolute;left:10px;top:10px;font-size:11px;color:var(--c);opacity:.35;animation:blinkeye 5s infinite}
@keyframes blinkeye{0%,90%,100%{opacity:.35}95%{opacity:0}}
.elc[data-el=eco] .en{text-shadow:2px 2px 0 rgba(127,184,168,.25)}
.elc[data-el=vaz]{box-shadow:inset 0 0 34px 6px #000}
.elc[data-el=asc]::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:repeating-linear-gradient(45deg,#b04a3a 0 6px,transparent 6px 12px);opacity:.5}
.elc[data-el=pac]::before{content:"§";position:absolute;right:12px;bottom:8px;color:var(--c);opacity:.3;font-family:Georgia,serif}
.elc[data-el=ger]::before{content:"";position:absolute;left:-20px;bottom:-20px;width:80px;height:80px;background:radial-gradient(circle,rgba(111,154,78,.4),transparent 70%);}
/* altar */
#altar{max-width:760px;margin:34px auto 0;border:1px solid var(--ecd);border-radius:5px;background:var(--panel);padding:20px 24px}
#altar h3{font-family:Georgia,serif;font-weight:400;letter-spacing:5px;text-transform:uppercase;color:var(--ec);margin:0 0 4px;display:flex;gap:12px;align-items:center}
#altar .mtier{border-left:2px solid var(--line2);padding:8px 0 8px 14px;margin:10px 0}
#altar .mtier.on{border-left-color:var(--ec)}
#altar .mtier .mt{font-size:10px;letter-spacing:2px;color:var(--ec);text-transform:uppercase}
#altar .mtier.off .mt{color:var(--faint)}
#altar .mtier .mx{font-size:12.5px;color:var(--dim);margin-top:3px}
#altar .mtier.off .mx{color:var(--faint);font-family:ui-monospace,monospace;letter-spacing:2px}
/* transição */
#transOv{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0}
#transOv.go{pointer-events:all;opacity:1}
#transOv.t-obs{background:radial-gradient(circle at 50% 50%,transparent 0,#000 0);animation:iris 1.5s ease-in-out forwards}
@keyframes iris{0%{background:radial-gradient(circle at 50% 50%,transparent 150%,#000 150%)}45%{background:radial-gradient(circle at 50% 50%,transparent 0%,#000 2%)}100%{background:radial-gradient(circle at 50% 50%,transparent 150%,#000 152%)}}
#transOv.t-eco{background:#7fb8a822;animation:stutter 1.3s steps(1) forwards}
@keyframes stutter{0%{opacity:1}14%{opacity:0}28%{opacity:.9}42%{opacity:0}60%{opacity:.7}74%{opacity:0}88%{opacity:.4}100%{opacity:0}}
#transOv.t-vaz{animation:engolir 1.6s ease-in forwards}
@keyframes engolir{0%{box-shadow:inset 0 0 0 0 #000}55%{box-shadow:inset 0 0 220px 48vmax #04050a}100%{box-shadow:inset 0 0 0 0 transparent}}
#transOv.t-asc{background:repeating-linear-gradient(45deg,#b04a3a 0 14px,#1a0f0c 14px 28px);animation:ferrugem 1.4s ease-in-out forwards}
@keyframes ferrugem{0%{transform:translateY(-100%)}45%{transform:translateY(0)}60%{transform:translateY(0)}100%{transform:translateY(100%)}}
#transOv.t-pac{display:flex;align-items:center;justify-content:center;background:rgba(20,6,8,.85);animation:fade 1.6s forwards}
#transOv.t-pac::after{content:"⚖";font-size:130px;color:#a32638;text-shadow:0 0 60px #a32638;animation:selo 1.6s cubic-bezier(.2,2.4,.4,1) forwards}
@keyframes selo{0%{transform:scale(4);opacity:0}35%{transform:scale(1);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes fade{0%{opacity:1}80%{opacity:1}100%{opacity:0}}
#transOv.t-ger{background:radial-gradient(circle at 20% 100%,#3d5a2a 0 8%,transparent 8%),radial-gradient(circle at 80% 90%,#3d5a2a 0 6%,transparent 6%),radial-gradient(circle at 50% 110%,#2c421f 0 10%,transparent 10%);background-color:transparent;animation:crescer 1.7s ease-in forwards}
@keyframes crescer{0%{background-size:0 0,0 0,0 0;opacity:1}55%{background-size:600% 600%,500% 500%,700% 700%;opacity:1}100%{background-size:700% 700%,600% 600%,800% 800%;opacity:0}}
/* ===== ROLETA ===== */
#roleta{border:1px solid var(--ecd);border-radius:5px;background:linear-gradient(180deg,var(--panel2),#0d0a08);padding:18px;text-align:center;margin-top:18px}
#roleta .rq{font-style:italic;color:var(--faint);font-size:12px;margin-bottom:12px}
.slotbox{width:230px;height:56px;margin:0 auto 14px;border:1px solid var(--line2);border-radius:4px;overflow:hidden;position:relative;background:#0a0806}
.slotbox::before,.slotbox::after{content:"";position:absolute;left:0;right:0;height:14px;z-index:2;pointer-events:none}
.slotbox::before{top:0;background:linear-gradient(#0a0806,transparent)}
.slotbox::after{bottom:0;background:linear-gradient(transparent,#0a0806)}
#slotreel{transition:none}
#slotreel div{height:56px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:22px;letter-spacing:6px;text-transform:uppercase;color:var(--ink)}
#slotreel div span{font-size:13px;color:var(--ec);margin-right:10px}
.slotwin{animation:winflash .8s ease-out}
@keyframes winflash{0%{box-shadow:0 0 0 0 var(--ec)}40%{box-shadow:0 0 60px 6px var(--ec)}100%{box-shadow:0 0 0 0 transparent}}
/* toolbar talentos */
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:8;border-bottom:1px solid var(--line);margin-bottom:12px}
.tbar input[type=text]{max-width:220px}
.tbar select{max-width:170px;width:auto}
/* ===== INVENTÁRIO ===== */
.inv-top{display:flex;gap:18px;flex-wrap:wrap}
.inv-left{flex:1 1 340px}.inv-right{flex:0 1 300px}
#invGrid{position:relative;display:grid;gap:2px;background:#0a0806;border:1px solid var(--line);padding:2px;width:max-content;border-radius:3px}
#invGrid .cell{width:38px;height:38px;background:#14100c;border-radius:2px}
.piece{position:absolute;cursor:grab;z-index:5}
.piece.dragging{opacity:.85;cursor:grabbing}
.bag{display:flex;gap:10px;flex-wrap:wrap;min-height:56px;border:1px dashed var(--line2);border-radius:3px;padding:8px}
.bagpiece{border-radius:3px;color:#0d0b0a;font-weight:700;font-size:9px;display:flex;align-items:center;justify-content:center;padding:3px;border:1px solid rgba(0,0,0,.35);text-align:center;line-height:1.05;cursor:grab;min-width:34px}
.shape-editor{display:grid;grid-template-columns:repeat(5,22px);gap:2px;margin:6px 0}
.sc{width:22px;height:22px;background:#0c0a08;border:1px solid var(--line);border-radius:2px;cursor:pointer}
.sc.on{background:var(--ec);border-color:var(--ec)}
.swatches{display:flex;gap:5px;margin:4px 0 8px;flex-wrap:wrap}
.sw{width:20px;height:20px;border-radius:3px;cursor:pointer;border:2px solid transparent}
.sw.sel{border-color:var(--ink)}
/* ===== BIBLIOTECA ===== */
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.doc{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px}
.doc .dth{height:100px;display:flex;align-items:center;justify-content:center;background:#0c0a08;border-radius:3px;overflow:hidden;font-size:34px;color:var(--faint);cursor:pointer}
.doc .dth img{width:100%;height:100%;object-fit:cover}
.doc input{font-size:11px;padding:4px 6px}
.doc .dbtns{display:flex;gap:4px;justify-content:space-between}
.dropzone{border:1px dashed var(--line2);border-radius:4px;padding:26px;text-align:center;color:var(--faint);font-size:12px;letter-spacing:1px;margin-bottom:14px;transition:.2s;cursor:pointer}
.dropzone.over{border-color:var(--ec);color:var(--ec);background:var(--eglow)}
/* ===== MODO SESSÃO ===== */
#sessview{display:none}
body.sess #mainview,body.sess .tabs{display:none}
body.sess #sessview{display:block}
.sessgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
@media(max-width:900px){.sessgrid{grid-template-columns:1fr}}
.bigrec{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bigrec .rec .rv input{font-size:24px;width:70px}
.bigrec .rec .rv .mx input{font-size:15px;width:54px}
.bigrec .rec .stp{width:34px;height:34px;font-size:16px}
.slog{max-height:220px;overflow:auto;font-size:12px;color:var(--dim)}
.slog div{border-bottom:1px solid var(--line);padding:4px 0}
.snote{display:flex;gap:6px;margin-bottom:8px}
.snlist{max-height:300px;overflow:auto}
.snlist .sn{border-left:2px solid var(--ecd);padding:4px 10px;margin-bottom:6px;font-size:12.5px;color:var(--dim)}
.snlist .sn b{color:var(--faint);font-weight:400;font-size:10px;margin-right:8px;font-family:ui-monospace,monospace}
/* rolagem flutuante */
#rollcard{position:fixed;right:22px;bottom:22px;z-index:70;background:var(--panel);border:1px solid var(--ec);border-radius:5px;padding:12px 18px;min-width:190px;opacity:0;transform:translateY(14px);transition:.3s;pointer-events:none;box-shadow:0 8px 40px -8px rgba(0,0,0,.8)}
#rollcard.on{opacity:1;transform:none}
#rollcard .rl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
#rollcard .rt{font-family:Georgia,serif;font-size:26px;color:var(--ink)}
#rollcard .rt small{font-size:12px;color:var(--faint)}
#rollcard .rg{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.g-crit{color:#e0c25a}.g-total{color:#8fae6a}.g-parcial{color:#c9a227}.g-falha{color:#c66}
/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(6,5,3,.78);display:none;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto}
#modal.on{display:flex}
#modalbox{background:var(--panel);border:1px solid var(--line2);border-radius:5px;max-width:640px;width:100%;padding:18px 20px}
#modalbox h3{font-family:Georgia,serif;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:var(--ec);margin:0 0 12px;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--goldim);color:var(--ink);padding:9px 16px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:90}
.toast.show{opacity:1}
.foot{text-align:center;font-size:10px;color:var(--faint);letter-spacing:3px;margin-top:34px;font-family:ui-monospace,monospace}
/* ===== TEMAS DE ELEMENTO ===== */
body[data-el=obs]{--ec:#c9a227;--ecd:#8a6f1c;--eglow:rgba(201,162,39,.16)}
body[data-el=eco]{--ec:#7fb8a8;--ecd:#4f7a6d;--eglow:rgba(127,184,168,.13)}
body[data-el=vaz]{--ec:#7c8fb5;--ecd:#48566f;--eglow:rgba(90,107,140,.14);--bg:#0a0b10;--panel:#10121a;--panel2:#141724;--line:#232838;--line2:#2f374d}
body[data-el=asc]{--ec:#c15a45;--ecd:#7d3527;--eglow:rgba(176,74,58,.15)}
body[data-el=pac]{--ec:#c13a52;--ecd:#77202f;--eglow:rgba(163,38,56,.15)}
body[data-el=ger]{--ec:#8dbb62;--ecd:#4f6d34;--eglow:rgba(111,154,78,.14)}
/* eco: ghosting nos títulos, crescente com a banda */
body[data-el=eco] h1,body[data-el=eco] .panel h2{text-shadow:calc(var(--band)*1.2px) calc(var(--band)*1.2px) 0 rgba(127,184,168,.35)}
/* obs: olho que pisca nos títulos */
body[data-el=obs][data-band="2"] .panel h2::after,body[data-el=obs][data-band="3"] .panel h2::after,body[data-el=obs][data-band="4"] .panel h2::after,body[data-el=obs][data-band="5"] .panel h2::after{content:"⊙";font-size:10px;color:var(--ec);animation:blinkeye 6s infinite}
/* obs: escopofobia — a nuca (banda 2+) e o olho na periferia (banda 3+) */
body[data-el=obs][data-band="2"] #fx-tunnel,body[data-el=obs][data-band="3"] #fx-tunnel,body[data-el=obs][data-band="4"] #fx-tunnel,body[data-el=obs][data-band="5"] #fx-tunnel{opacity:1;visibility:visible}
body[data-el=obs][data-band="5"] #fx-tunnel{animation:scopobreath 11s ease-in-out infinite;will-change:opacity}
@keyframes scopobreath{0%,100%{opacity:.7}50%{opacity:1}}
body[data-el=obs][data-band="3"] #fx-eye{opacity:.035;visibility:visible;--eyeb:22px}
body[data-el=obs][data-band="4"] #fx-eye{opacity:.075;visibility:visible;--eyeb:15px}
body[data-el=obs][data-band="5"] #fx-eye{opacity:.12;visibility:visible;--eyeb:10px}
/* asc: listras de ferrugem e tremor */
body[data-el=asc] .panel{border-image:repeating-linear-gradient(45deg,var(--ecd) 0 8px,var(--line) 8px 16px) 1}
body[data-el=asc][data-band="4"] .wrap,body[data-el=asc][data-band="5"] .wrap{animation:servo 3.5s steps(2) infinite}
@keyframes servo{0%,96%{transform:none}98%{transform:translate(1px,-1px)}}
/* pacto: linha de assinatura sob os títulos */
body[data-el=pac][data-band="2"] .panel h2,body[data-el=pac][data-band="3"] .panel h2,body[data-el=pac][data-band="4"] .panel h2,body[data-el=pac][data-band="5"] .panel h2{border-bottom:1px solid var(--ecd);padding-bottom:5px}
/* germe: musgo nos cantos, cresce com a banda */
body[data-el=ger] .panel::before{content:"";position:absolute;left:-30px;bottom:-30px;width:calc(40px + var(--band)*26px);height:calc(40px + var(--band)*26px);background:radial-gradient(circle,rgba(111,154,78,.28),transparent 70%);pointer-events:none}
body[data-el=ger][data-band="4"] .panel::after,body[data-el=ger][data-band="5"] .panel::after{content:"❋";position:absolute;right:8px;bottom:4px;color:var(--ecd);font-size:11px;opacity:.6}
/* vazio: a ficha some pelas bordas */
body[data-el=vaz][data-band="3"] .tabs button:not(.active),body[data-el=vaz][data-band="4"] .tabs button:not(.active),body[data-el=vaz][data-band="5"] .tabs button:not(.active){opacity:.5}
body[data-el=vaz][data-band="5"] .panel:not(:hover){opacity:.82;transition:opacity .8s}
/* colapso 17–20: perturbador, nunca bloqueante */
body[data-band="5"] h1{animation:aberra 4s steps(3) infinite}
@keyframes aberra{0%,94%{text-shadow:none}96%{text-shadow:-2px 0 var(--red),2px 0 var(--ec)}98%{text-shadow:2px 0 var(--red),-2px 0 var(--ec)}}
body[data-band="5"] .panel h2:not(:hover){filter:blur(.4px)}
body[data-band="5"] .panel h2:hover,body[data-band="5"] h1:hover{animation:none;filter:none}
/* calmar / reduced motion */
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}
body.calm #fx-canvas,body.calm #whisper,body.calm #fx-eye,body.calm #fx-tunnel,body.calm .fx-flash{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#fx-canvas,#fx-eye,#fx-tunnel,.fx-flash{display:none}}
@media(max-width:640px){h1{font-size:20px;letter-spacing:5px}.wrap{padding:10px 10px 50px}.elc{width:100%}}

attrs:{car:0,ner:0,jui:0,tem:0,lab:0},

function fixS(){const d=DEF();
 for(const k of["attrs","cur","curMax","custom","inv","sess","ui"])S[k]=Object.assign({},d[k],S[k]||{});
 for(const k of["fardosX","esc","maest","tal","conh","div","cred"])if(!Array.isArray(S[k]))S[k]=[];
 for(const k of["hab","mag","mae"])if(!Array.isArray(S.custom[k]))S.custom[k]=[];
 if(!Array.isArray(S.sess.notes))S.sess.notes=[];if(!Array.isArray(S.sess.log))S.sess.log=[];
 if(typeof S.per!=="object"||!S.per)S.per={};if(typeof S.cond!=="object"||!S.cond)S.cond={};
 if(!S.inv.pieces)S.inv.pieces=[];if(!S.inv.bag)S.inv.bag=[];if(!S.inv.seq)S.inv.seq=1;

/* ---------- cálculos ---------- */
const A=k=>{const v=parseInt(S.attrs[k],10);return isNaN(v)?0:v;};
const FP=()=>FARDOS[S.fardo]||null;
function owned(){const o=[];if(S.fardo&&FARDOS[S.fardo])o.push(S.fardo);for(const f of S.fardosX)if(FARDOS[f]&&!o.includes(f))o.push(f);return o;}
/* máximos: a fórmula é o padrão; S.curMax[k] preenchido sobrescreve na mão */
function baseMaxVida(){const f=FP();return 3+A("car")+(f?f.vida*S.nivel:0);}
function baseMaxFol(){const f=FP();return 3+A("ner")+((f&&f.comb==="fol")?f.cv*S.nivel:0);}
function baseMaxSin(){const f=FP();return 3+A("jui")+((f&&f.comb==="sin")?f.cv*S.nivel:0);}
function baseMaxLuc(){return 5+A("tem");}
function baseMaxOf(k){return {vida:baseMaxVida,fol:baseMaxFol,sin:baseMaxSin,luc:baseMaxLuc}[k]();}
function ovMax(k){const o=S.curMax&&S.curMax[k];return(o==null||o==="")?baseMaxOf(k):Math.max(0,parseInt(o,10)||0);}
function maxVida(){return ovMax("vida");}
function maxFol(){return ovMax("fol");}
function maxSin(){return ovMax("sin");}
function maxLuc(){return ovMax("luc");}
function maxGente(){return Math.max(0,1+A("lab"));}
function curOf(k){const m={vida:maxVida,fol:maxFol,sin:maxSin,luc:maxLuc}[k];const v=S.cur[k];return(v==null||v==="")?m():parseInt(v,10)||0;}
function ppTot(){const n=S.nivel;return 2+(n-1)+(n>=8?1:0)+(n>=15?1:0);}
function pcTot(){const n=S.nivel;return 4+2*(n-1)+(n>=8?1:0)+(n>=12?1:0)+(n>=15?1:0);}
function mtTot(){const n=S.nivel;return 1+(n>=4?1:0)+(n>=8?1:0)+(n>=12?1:0);}
function ppGasto(){return 2*S.esc.length;}
function pcGasto(){let t=0;for(const k of S.tal)t+=parseInt(k.split("|")[0],10)||0;return t+(parseInt(S.pcExtra,10)||0);}
function mtUsado(){return S.maest.reduce((a,m)=>a+1+(m.st||0),0);}
function hasHab(f,name){const d=FARDOS[f];if(!d)return false;if(d.base.some(h=>h.n===name))return true;return S.esc.includes(f+"|"+name);}
const fmtRS=v=>{v=parseFloat(v)||0;try{return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}catch(e){return "R$ "+v;}};

 const d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6),tot=d1+d2+mod;

let _ecCache="#b8932f";
function applyTheme(){const b=bandOf(S.ruido||0);
 document.body.dataset.el=S.elem||"";document.body.dataset.band=b;
 document.body.style.setProperty("--band",b);

 document.body.classList.toggle("lowluc",curOf("luc")<=2);
 const g=$("h1g");if(g)g.textContent=S.elem?(" "+ELM(S.elem).g):"";
 _ecCache=(getComputedStyle(document.body).getPropertyValue("--ec")||"").trim()||"#b8932f";

function updDock(){const d=$("divDock");const n=S.div.filter(x=>x&&x.trim()).length;
 if(n>0){d.classList.add("on");d.innerHTML=`⚖ o Pacto cobra — <b>${n}</b> dívida${n>1?"s":""} registrada${n>1?"s":""} <span style="color:var(--faint)">· aba Dívidas &amp; Notas</span>`;}

/* partículas */
let FX={run:false,q:false,ps:[],last:0};
function syncFX(){const b=bandOf(S.ruido||0);const want=!!S.elem&&b>0&&!S.ui.calm&&!document.hidden;
 if(want&&!FX.run){FX.run=true;fxKick();}if(!want){FX.run=false;const cv=$("fx-canvas");if(cv){const x=cv.getContext&&cv.getContext("2d");if(x)x.clearRect(0,0,cv.width,cv.height);}}
 scopoSync();}
/* FX.q garante um único rAF pendente: desligar e religar no mesmo frame não duplica o loop */
function fxKick(){if(FX.q)return;FX.q=true;rAF(fxTick);}
function fxTick(t){FX.q=false;if(!FX.run)return;const cv=$("fx-canvas");if(!cv)return;const ctx=cv.getContext&&cv.getContext("2d");if(!ctx){FX.run=false;return;}
 if(cv.width!==innerWidth||cv.height!==innerHeight){cv.width=innerWidth;cv.height=innerHeight;}
 const b=bandOf(S.ruido||0),el=S.elem,alvo=el==="vaz"?Math.min(b*2,8):b*3;
 if(FX.ps.length<alvo&&Math.random()<.12)FX.ps.push(fxNew(el,cv));
 ctx.clearRect(0,0,cv.width,cv.height);
 FX.ps=FX.ps.filter(p=>{p.life+=1;p.x+=p.vx;p.y+=p.vy;const a=Math.sin(Math.PI*Math.min(1,p.life/p.max));
  if(p.life>=p.max)return false;ctx.globalAlpha=a*p.op;fxDraw(ctx,el,p);ctx.globalAlpha=1;return true;});
 if(FX.ps.length>alvo)FX.ps.length=alvo;
 eyeStep(t);
 fxKick();}
function fxNew(el,cv){const W=cv.width,H=cv.height,r=Math.random;
 const base={x:r()*W,y:r()*H,vx:(r()-.5)*.2,vy:(r()-.5)*.2,life:0,max:240+r()*240,op:.16,s:4+r()*7};
 if(el==="ger"){base.y=H+10;base.vy=-.14-r()*.2;base.vx=(r()-.5)*.12;base.op=.2;}
 if(el==="asc"){base.vy=-.05;base.op=.15;}
 if(el==="pac"){base.vx=.2+r()*.2;base.vy=0;base.op=.12;}
 if(el==="eco"){base.vx=0;base.vy=0;base.max=160;base.op=.14;}
 if(el==="vaz"){base.vx=0;base.vy=0;base.op=.5;base.max=300;}
 return base;}
function fxDraw(c,el,p){c.strokeStyle=c.fillStyle=_ecCache;
 if(el==="obs"){c.beginPath();c.ellipse(p.x,p.y,p.s*1.6,p.s*.8,0,0,7);c.stroke();c.beginPath();c.arc(p.x,p.y,p.s*.32,0,7);c.fill();}
 else if(el==="eco"){const k=(p.life/p.max);c.beginPath();c.arc(p.x,p.y,p.s*3*k+2,0,7);c.stroke();}
 else if(el==="vaz"){c.fillStyle="#04050a";c.beginPath();c.arc(p.x,p.y,p.s*1.4,0,7);c.fill();}
 else if(el==="asc"){c.save();c.translate(p.x,p.y);c.rotate(p.life*.01);c.strokeRect(-p.s/2,-p.s/2,p.s,p.s);c.restore();}
 else if(el==="pac"){c.beginPath();c.moveTo(p.x,p.y);for(let i=1;i<5;i++)c.lineTo(p.x+i*7,p.y+Math.sin(p.life*.1+i)*2.4);c.stroke();}
 else if(el==="ger"){c.beginPath();c.arc(p.x,p.y,p.s*.5,0,7);c.fill();c.globalAlpha*=.4;c.beginPath();c.arc(p.x,p.y,p.s,0,7);c.stroke();}}
document.addEventListener("visibilitychange",()=>syncFX());

/* sussurros */
let _wt=null,_wsig="";
/* quem tem susB (só o obs, por ora) sussurra conforme a banda; os outros mantêm o sus simples */
function susOf(e,b){const B=e.susB;if(!B)return e.sus;return b<=2?B.lo:(b<=4?B.mid:B.hi);}
function whisperLoop(){const b=bandOf(S.ruido||0),e=ELM(S.elem);
 const sig=(S.elem||"")+"|"+b+"|"+(S.ui.mute?1:0)+"|"+(S.ui.calm?1:0);
 if(sig===_wsig&&_wt)return; /* render() roda a cada clique: sem mudança relevante, o ciclo em curso segue */
 _wsig=sig;clearTimeout(_wt);_wt=null;
 if(!e||b<1||S.ui.mute||S.ui.calm)return;
 let delay=[0,55,40,28,20,14][b]*1000*(0.7+Math.random()*.6);
 if(e.id==="obs"&&b>=4)delay*=.6; /* no ápice do Observação eles se acumulam */
 _wt=setTimeout(()=>{_wt=null;const w=$("whisper"),lst=susOf(e,b);let tx=lst[Math.floor(Math.random()*lst.length)];
  if(b>=4&&Math.random()<.5){const ws=tx.split(" ");const i=Math.floor(Math.random()*ws.length);ws[i]=alien(ws[i]);tx=ws.join(" ");}
  w.textContent=tx;w.style.left=(8+Math.random()*70)+"%";w.style.top=(10+Math.random()*75)+"%";
  w.classList.add("on");setTimeout(()=>w.classList.remove("on"),4200);whisperLoop();},delay);}

/* ============ ESCOPOFOBIA — piloto do elemento Observação ============
   tudo aqui morre com body.calm, com prefers-reduced-motion e com a aba oculta.
   nada toca o DOM da ficha nem o estado S: só overlays pointer-events:none. */
/* a MediaQueryList é criada uma vez: scopoOn() é consultado a cada frame pelo olho */
const _mqRM=window.matchMedia?matchMedia("(prefers-reduced-motion:reduce)"):null;
const RM=()=>!!(_mqRM&&_mqRM.matches);
const scopoOn=()=>S.elem==="obs"&&!S.ui.calm&&!RM();

/* --- o olho na periferia: segue o cursor sem nunca alcançá-lo --- */
let EYE={x:0,y:0,tx:0,ty:0,s:1,mv:0,init:false};
addEventListener("mousemove",e=>{EYE.tx=e.clientX;EYE.ty=e.clientY;EYE.mv=performance.now();},{passive:true});
function eyeStep(t){if(!(scopoOn()&&bandOf(S.ruido||0)>=3))return;
 const w=$("fx-eye"),i=w&&w.firstElementChild;if(!i)return;
 if(!EYE.init){EYE.x=innerWidth/2;EYE.y=innerHeight*.45;EYE.init=true;}
 const parado=(t-EYE.mv)>4000; /* mouse quieto: ele se centraliza e encara */
 const gx=parado?innerWidth/2:EYE.tx,gy=parado?innerHeight*.45:EYE.ty,k=parado?.006:.028;
 EYE.x+=(gx-EYE.x)*k;EYE.y+=(gy-EYE.y)*k;EYE.s+=((parado?1.14:1)-EYE.s)*.008;
 i.style.transform=`translate3d(${EYE.x.toFixed(1)}px,${EYE.y.toFixed(1)}px,0) scale(${EYE.s.toFixed(3)})`;}

/* --- o texto que pisca: overlay por cima, nunca mutação do DOM real --- */
let _ft=null,_fEl=null;
function flashClear(){if(_fEl&&_fEl.parentNode)_fEl.parentNode.removeChild(_fEl);_fEl=null;}
function bgOf(el){for(let n=el;n&&n!==document.documentElement;n=n.parentElement){
  const c=getComputedStyle(n).backgroundColor;
  if(c&&c!=="transparent"&&!/^rgba\(\s*0,\s*0,\s*0,\s*0\s*\)$/.test(c))return c;}
 return getComputedStyle(document.body).backgroundColor||"#0f0d0b";}
function flashPick(){const out=[];
 document.querySelectorAll(".hx,.panel h2,.hint,label").forEach(el=>{
  if(el.querySelector("input,textarea,select,button"))return;
  if(el.matches(":hover"))return;
  if(document.activeElement&&el.contains(document.activeElement))return;
  if(!el.textContent.trim())return;
  const r=el.getBoundingClientRect();
  if(r.width<70||r.height<10||r.height>60||r.top<4||r.bottom>innerHeight-4)return;
  out.push([el,r]);});
 return out.length?out[Math.floor(Math.random()*out.length)]:null;}
function flashNow(){flashClear();
 if(!(scopoOn()&&bandOf(S.ruido||0)>=4)||document.hidden)return;
 if($("modal").classList.contains("on"))return;
 const p=flashPick();if(!p)return;
 const el=p[0],r=p[1],cs=getComputedStyle(el),d=document.createElement("div");
 d.className="fx-flash";
 d.style.cssText=`left:${r.left}px;top:${r.top}px;width:${Math.ceil(r.width)}px;height:${Math.ceil(r.height)}px;`+
  `background:${bgOf(el)};color:${cs.color};font-family:${cs.fontFamily};font-size:${cs.fontSize};font-weight:${cs.fontWeight};`+
  `letter-spacing:${cs.letterSpacing};text-transform:${cs.textTransform}`;
 d.textContent=SUS_OBS.hi[Math.floor(Math.random()*SUS_OBS.hi.length)];
 document.body.appendChild(d);_fEl=d;
 setTimeout(flashClear,150);}
function flashSched(){clearTimeout(_ft);_ft=setTimeout(()=>{flashNow();flashSched();},20000+Math.random()*20000);}

/* --- a presença: Web Audio, só depois de um gesto do usuário e com o mute desligado --- */
let AUD={ctx:null,gain:null,ogain:null,gest:false,on:false,timer:null};
function audGesture(){if(AUD.gest)return;AUD.gest=true;scopoSync();}
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,audGesture,{once:true,passive:true}));
function audBuild(){if(AUD.ctx)return true;
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
 try{const c=new AC(),n=Math.floor(c.sampleRate*2),buf=c.createBuffer(1,n,c.sampleRate),ch=buf.getChannelData(0);
  let last=0;for(let i=0;i<n;i++){const wn=Math.random()*2-1;last=(last+.02*wn)/1.02;ch[i]=last*3.2;} /* ruído marrom */
  const src=c.createBufferSource();src.buffer=buf;src.loop=true;
  const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=240;
  const g=c.createGain();g.gain.value=0;
  src.connect(f);f.connect(g);g.connect(c.destination);src.start();
  const o=c.createOscillator();o.type="sine";o.frequency.value=52;
  const og=c.createGain();og.gain.value=0;o.connect(og);og.connect(c.destination);o.start();
  AUD.ctx=c;AUD.gain=g;AUD.ogain=og;return true;}catch(e){return false;}}
function audOff(){clearTimeout(AUD.timer);AUD.timer=null;AUD.on=false;
 if(!AUD.ctx)return;try{const t=AUD.ctx.currentTime;
  for(const g of [AUD.gain.gain,AUD.ogain.gain]){g.cancelScheduledValues(t);g.setTargetAtTime(0,t,.4);}}catch(e){}}
function audBreath(){if(!AUD.on||!AUD.ctx)return;
 const b=bandOf(S.ruido||0),t=AUD.ctx.currentTime,pico=b>=5?.02:.012;
 try{const g=AUD.gain.gain;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);
  g.linearRampToValueAtTime(pico,t+3.2);g.linearRampToValueAtTime(0,t+8);}catch(e){}
 AUD.timer=setTimeout(audBreath,(9+Math.random()*11)*1000);}
function audSync(want,b){
 if(!want||!AUD.gest)return audOff();
 if(!audBuild())return;
 if(AUD.ctx.state==="suspended")AUD.ctx.resume().catch(()=>{});
 try{AUD.ogain.gain.setTargetAtTime(b>=5?.006:0,AUD.ctx.currentTime,2);}catch(e){}
 if(!AUD.on){AUD.on=true;audBreath();}}

/* liga/desliga o pacote inteiro conforme elemento, banda, calmar, mute e visibilidade */
function scopoSync(){const b=bandOf(S.ruido||0),on=scopoOn()&&!document.hidden;
 if(on&&b>=4){if(!_ft)flashSched();}
 else{clearTimeout(_ft);_ft=null;flashClear();}
 audSync(on&&b>=4&&!S.ui.mute,b);}

/* medidores de maestria — recurso próprio de uma trilha (Fúria, etc.) */
const RESET_LB={cena:"zerar (nova cena)",sessao:"zerar (nova sessão)",permanente:"zerar"};
function meterOf(m){const md=m&&!m.cu?maeData(m):null;return(md&&md.medidor)||null;}
function meterCap(m){const d=meterOf(m);if(!d)return null;
 return {min:d.min,max:(typeof m.recMax==="number"?m.recMax:d.tetos[m.st])};}
function meterVal(m){const c=meterCap(m);return c?Math.max(c.min,Math.min(c.max,m.rec||0)):0;}
function meterCard(m,i){const d=meterOf(m);if(!d)return "";
 const tp=meterCap(m).max,v=meterVal(m),pc=tp>d.min?Math.round((v-d.min)/(tp-d.min)*100):0;
 const ov=(typeof m.recMax==="number"?m.recMax:"");
 return `<div class="rec" id="mtr_${i}" style="margin-top:8px"><div class="rn">${esc(d.nome)} <b>teto ${tp} · ${STG[m.st]}</b></div><div class="rv">
 <button class="stp" onclick="stepMeter(${i},-1)">−</button>
 <input type="number" id="mcur_${i}" min="${d.min}" max="${tp}" value="${v}" onchange="setMeter(${i},this.value)"><span class="mx">/ <input type="number" min="${d.min}" id="mmax_${i}" value="${ov}" placeholder="${d.tetos[m.st]}" title="teto — deixe vazio para usar o teto do estágio" onchange="setMeterMax(${i},this.value)"></span>
 <button class="stp" onclick="stepMeter(${i},1)">+</button>
 ${d.reset?`<button class="btn mini" style="margin-left:auto" onclick="resetMeter(${i})">${RESET_LB[d.reset]||"zerar ("+esc(d.reset)+")"}</button>`:""}</div>
 <div class="bar"><i id="mbar_${i}" style="width:${pc}%"></i></div></div>`;}
function meterSync(i){const el=$("mtr_"+i);if(el)el.outerHTML=meterCard(S.maest[i],i);}
function meterPut(i,v){const m=S.maest[i];if(!m)return;const c=meterCap(m);if(!c)return;
 m.rec=Math.max(c.min,Math.min(c.max,isNaN(v)?c.min:v));save();meterSync(i);}
function stepMeter(i,d){const m=S.maest[i];if(m)meterPut(i,meterVal(m)+d);}
function setMeter(i,v){meterPut(i,parseInt(v,10));}
function setMeterMax(i,v){const m=S.maest[i];if(!m)return;
 m.recMax=(v===""?null:Math.max(0,parseInt(v,10)||0));save();meterSync(i);}
function resetMeter(i){const m=S.maest[i];if(!m)return;const c=meterCap(m);if(c)meterPut(i,c.min);}

function talList(){const box=$("tallist");if(!box)return;const q=TF.q.toLowerCase();let html="",last=0;
 TALENTOS.forEach((t,gi)=>{const[pc,n,tx,rq]=t,key=pc+"|"+n,own=S.tal.includes(key);
  if(TF.c&&pc!==TF.c)return;if(TF.e==="c"&&!own)return;if(TF.e==="d"&&own)return;
  if(q&&!(n+" "+tx).toLowerCase().includes(q))return;
  if(pc!==last){last=pc;html+=`<div class="secband">Talentos de <b>${pc} PC</b></div>`;}
  let rb="";if(rq){const an=ATTRS.find(a=>a[0]===rq[0]);const ok=A(rq[0])>=rq[1];rb=badge(an[1]+" +"+rq[1],ok);}
  html+=`<div class="hcard"><div class="ht"><b>${esc(n)}</b><span class="tag dark">${pc} PC</span>${rb}
  ${own?`<span class="tag ok">comprado</span><span class="src"><button class="btn mini del" onclick="refundTal(${gi})">devolver</button></span>`
   :`<span class="src"><button class="btn mini gold" onclick="buyTal(${gi})">comprar</button></span>`}</div>
  <div class="hx">${esc(tx).replace(/⟑⋏⊙⌖◊/g,rw())}</div></div>`;});
 box.innerHTML=html||`<div class="hint">nada encontrado.</div>`;}
function buyTal(gi){const[pc,n,,rq]=TALENTOS[gi],pcL=pcTot()-pcGasto();
 if(pcL<pc&&!confirm("PC insuficiente — comprar mesmo assim (fica negativo)?"))return;
 if(rq&&A(rq[0])<rq[1]&&!confirm("Requisito de atributo não atendido — comprar mesmo assim?"))return;
 S.tal.push(pc+"|"+n);save();rTal();toast(n+" adquirido.");}
function refundTal(gi){const[pc,n]=TALENTOS[gi];S.tal=S.tal.filter(k=>k!==pc+"|"+n);save();rTal();toast(pc+" PC devolvidos.");}
function spinRoleta(){if(spinning)return;spinning=true;$("btnGirar").disabled=true;$("rolres").innerHTML="";
 const pick=Math.floor(Math.random()*5),seq=[];
 for(let r=0;r<4;r++)for(const a of ATTRS)seq.push(a);
 for(let i=0;i<=pick;i++)seq.push(ATTRS[i]);
 const reel=$("slotreel");reel.style.transform="translateY(0)";
 reel.innerHTML=seq.map(a=>`<div><span>${alien(a[1][0])}</span>${a[1]}</div>`).join("");
 const total=(seq.length-1)*56,t0=performance.now(),D=S.ui.calm?200:2500;
 (function fr(t){const p=Math.min(1,(t-t0)/D),e2=1-Math.pow(1-p,3);
  reel.style.transform=`translateY(${-total*e2}px)`;
  if(p<1)rAF(fr);else{const a=ATTRS[pick];$("slotbox").classList.add("slotwin");setTimeout(()=>{const b=$("slotbox");if(b)b.classList.remove("slotwin");},900);
   $("rolres").innerHTML=`a roleta cravou: <b style="color:var(--ec);letter-spacing:3px">${a[1].toUpperCase()}</b> — ${esc(a[2])}`;
   S.sess.log.unshift({t:hhmm(),x:"Roleta Maluca → "+a[1]});S.sess.log=S.sess.log.slice(0,40);save();
   toast("Roleta Maluca: "+a[1].toUpperCase());spinning=false;const g=$("btnGirar");if(g)g.disabled=false;}})(t0);}

/* ---------- BIBLIOTECA (IndexedDB) ---------- */
let _db=null,_urls={};
function idb(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej("no-idb");if(_db)return res(_db);
 const rq=indexedDB.open("prot4db",1);
 rq.onupgradeneeded=e=>{e.target.result.createObjectStore("docs",{keyPath:"id",autoIncrement:true});};
 rq.onsuccess=e=>{_db=e.target.result;res(_db);};rq.onerror=()=>rej(rq.error);});}
function dbAll(){return idb().then(db=>new Promise((res,rej)=>{const r=db.transaction("docs").objectStore("docs").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}));}
function dbAdd(rec){return idb().then(db=>new Promise((res,rej)=>{const r=db.transaction("docs","readwrite").objectStore("docs").add(rec);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
function dbPut(rec){return idb().then(db=>new Promise((res,rej)=>{const r=db.transaction("docs","readwrite").objectStore("docs").put(rec);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}));}
function dbDel(id){return idb().then(db=>new Promise((res,rej)=>{const r=db.transaction("docs","readwrite").objectStore("docs").delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}));}
function rBib(){$("mainview").innerHTML=`<div class="panel"><h2>Biblioteca do Caso <small>PDFs e imagens — mapas, retratos, recortes de jornal</small></h2>
 <div class="dropzone" id="dz" onclick="$('bibFile').click()">arraste PDFs ou imagens aqui · ou clique para escolher</div>
 <div class="hint">os arquivos ficam salvos <b>neste navegador</b> (IndexedDB) — não entram no JSON de exportação nem nos slots.</div>
 <div class="docgrid" id="docgrid" style="margin-top:14px"></div></div>`;
 const dz=$("dz");
 dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
 dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
 dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");bibAdd(e.dataTransfer.files);});
 bibRefresh();}
function bibAdd(files){const fl=Array.from(files||[]).filter(f=>/pdf|image/.test(f.type));
 if(!fl.length)return toast("Só PDFs e imagens.");
 Promise.all(fl.map(f=>dbAdd({name:f.name.replace(/\.[^.]+$/,""),type:f.type,blob:f,note:"",ts:Date.now()})))
 .then(()=>{toast(fl.length+" documento(s) arquivado(s).");bibRefresh();})
 .catch(()=>toast("Este navegador recusou o arquivo (IndexedDB indisponível)."));}
function bibURL(r){if(!_urls[r.id])try{_urls[r.id]=URL.createObjectURL(r.blob);}catch(e){_urls[r.id]="";}return _urls[r.id];}
function bibRefresh(){const g=$("docgrid");if(!g)return;
 dbAll().then(list=>{list.sort((a,b)=>b.ts-a.ts);
  g.innerHTML=list.map(r=>`<div class="doc">
  <div class="dth" onclick="bibView(${r.id})">${/image/.test(r.type)?`<img src="${bibURL(r)}" alt="">`:"⌸"}</div>
  <input type="text" value="${esc(r.name)}" onchange="bibRen(${r.id},this.value)">
  <input type="text" placeholder="nota…" value="${esc(r.note||"")}" onchange="bibNote(${r.id},this.value)">
  <div class="dbtns"><button class="btn mini" onclick="bibView(${r.id})">abrir</button>
  <button class="btn mini del" onclick="bibDel(${r.id})">excluir</button></div></div>`).join("")
  ||`<div class="hint">o arquivo do caso está vazio. Por enquanto.</div>`;})
 .catch(()=>{g.innerHTML=`<div class="hint">Biblioteca indisponível neste navegador (sem IndexedDB).</div>`;});}
function bibFind(id,cb){dbAll().then(l=>{const r=l.find(x=>x.id===id);if(r)cb(r);});}
function bibRen(id,v){bibFind(id,r=>{r.name=v;dbPut(r);});}
function bibNote(id,v){bibFind(id,r=>{r.note=v;dbPut(r);});}
function bibDel(id){if(!confirm("Excluir este documento do arquivo?"))return;dbDel(id).then(bibRefresh);}
function bibView(id){bibFind(id,r=>{const u=bibURL(r);
 modal(`<h3>${esc(r.name)}</h3>
 ${/image/.test(r.type)?`<img src="${u}" style="max-width:100%;max-height:70vh;display:block;margin:0 auto;border:1px solid var(--line)">`
  :`<iframe src="${u}" style="width:100%;height:70vh;border:1px solid var(--line);background:#222"></iframe>`}
 <div style="margin-top:10px;display:flex;justify-content:space-between">
 <a class="btn" href="${u}" download="${esc(r.name)}" style="text-decoration:none">baixar</a>
 <button class="btn" onclick="closeModal()">fechar</button></div>`);});}

  <div style="flex:0;min-width:130px"><label>Brio</label><div style="display:flex;gap:6px;align-items:center">
   <button class="stp btn mini" onclick="setNum('brio',Math.max(0,S.brio-1));rSess()">−</button>
   <span style="font-family:Georgia,serif;font-size:22px;min-width:26px;text-align:center">${S.brio}</span>
   <button class="stp btn mini" onclick="setNum('brio',S.brio+1);rSess()">+</button></div></div>
  <div style="flex:0;min-width:150px"><label>Gente</label><div style="display:flex;gap:6px;align-items:center">
   <button class="stp btn mini" onclick="setGente(Math.max(0,curGente()-1));rSess()">−</button>
   <span style="font-family:Georgia,serif;font-size:22px;min-width:26px;text-align:center">${curGente()}<small style="font-size:11px;color:var(--faint)">/${maxGente()}</small></span>
   <button class="stp btn mini" onclick="setGente(Math.min(maxGente(),curGente()+1));rSess()">+</button></div></div>
  <div><label>Condições</label><div class="chips">${CONDICOES.map(c=>`<span class="chip ${S.cond[c[0]]?"on":""}" title="${esc(c[1])}" onclick="toggleCond('${c[0].replace(/'/g,"\\'")}')">${c[0]}</span>`).join("")}</div></div>
 </div></div>
 <div class="sessgrid">
 <div class="panel"><h2>Perícias <small><label style="display:inline;letter-spacing:0;text-transform:none;cursor:pointer"><input type="checkbox" ${SESS_ALL?"checked":""} onchange="SESS_ALL=this.checked;rSess()" style="accent-color:var(--ec)"> mostrar todas</label></small></h2>
 <div class="skills">${skillsHTML(true)}</div></div>
 <div>
 <div class="panel"><h2>Notas rápidas</h2>
  <div class="snote"><input type="text" id="snIn" placeholder="pista, nome, endereço…" onkeydown="if(event.key==='Enter')addSN()"><button class="btn mini gold" onclick="addSN()">+</button></div>
  <div class="snlist">${S.sess.notes.map((n,i)=>`<div class="sn"><b>${esc(n.t)}</b>${esc(n.x)} <span style="float:right;color:var(--faint);cursor:pointer" onclick="S.sess.notes.splice(${i},1);save();rSess()">×</span></div>`).join("")||`<div class="hint">nada anotado nesta sessão.</div>`}</div>
  <div style="display:flex;gap:6px;margin-top:8px">
  <button class="btn mini" onclick="arqSN()">arquivar em Notas</button>
  <button class="btn mini del" onclick="if(confirm('Limpar as notas da sessão?')){S.sess.notes=[];save();rSess()}">limpar</button></div></div>
 <div class="panel"><h2>Rolagens</h2><div class="slog" id="slog">${logHTML()}</div></div>
 </div></div>`;
 barSync();}
function addSN(){const i=$("snIn");if(!i.value.trim())return;S.sess.notes.unshift({t:hhmm(),x:i.value.trim()});i.value="";save();rSess();}
function arqSN(){if(!S.sess.notes.length)return toast("Nada para arquivar.");
 const d=new Date().toLocaleDateString("pt-BR");
 S.notas=("— sessão "+d+" —\n"+S.sess.notes.slice().reverse().map(n=>n.t+" · "+n.x).join("\n")+"\n\n")+(S.notas||"");
 S.sess.notes=[];save();rSess();toast("Notas arquivadas em Dívidas & Notas.");}

/* ============ INVENTÁRIO (portado da ficha antiga) ============ */
const GRID_COLS=6,GAP=2,CSZ=38;
const PIECE_COLORS=["#c9a227","#8dbb62","#7fb8a8","#c15a45","#7c8fb5","#c13a52","#b8b0a0","#8a7a5a"];
let editorColor=PIECE_COLORS[0],editorShape=[],selectedPiece=null,dragInfo=null,_invKey=false;
function gridRows(){return Math.max(4,Math.min(10,6+A("car")));}
function rInv(){
 $("mainview").innerHTML=`<div class="panel"><h2>Mochila <small>arraste para posicionar · clique numa peça e tecle R para girar</small>
 <span style="margin-left:auto;font-size:12px;color:var(--dim);letter-spacing:0;text-transform:none;font-family:system-ui">R$ <input type="number" step="50" style="width:110px;display:inline-block;padding:3px 7px" value="${S.dinheiro}" onchange="setNum('dinheiro',this.value);toast(fmtRS(S.dinheiro))"></span></h2>
 <div class="inv-top">
  <div class="inv-left">
   <div class="hint" style="margin-bottom:8px">Capacidade pela Carne: grade <b id="gi">${GRID_COLS} × ${gridRows()}</b>.</div>
   <div id="invGrid"></div>
   <div style="margin-top:12px"><label>Bolsa de espera (não cabem / fora do grid)</label><div class="bag" id="bag"></div></div>
  </div>
  <div class="inv-right"><div class="panel" style="margin:0">
   <h2>Criar item</h2>
   <div class="row"><div><label>Nome</label><input type="text" id="pieceName" placeholder="ex: Espingarda"></div></div>
   <label>Cor</label><div class="swatches" id="swatches"></div>
   <label>Formato (clique nas células)</label><div class="shape-editor" id="shapeEd"></div>
   <button class="btn mini" onclick="clearShape()">limpar formato</button>
   <div style="margin-top:10px"><button class="btn gold" onclick="addPiece()">+ adicionar à bolsa</button></div>
   <div class="hint">Formato livre: L, T, linha, quadrado… Cada célula ocupa 1 espaço da mochila. Depois arraste da bolsa para a grade.</div>
  </div></div>
 </div></div>`;
 buildSwatches();buildShapeEditor();renderGrid();renderBag();
 if(!_invKey){_invKey=true;document.addEventListener("keydown",e=>{
  if((e.key==="r"||e.key==="R")&&selectedPiece&&S.ui.tab==="inv"&&!/input|textarea/i.test(document.activeElement.tagName)){
   const p=selectedPiece,old=p.rot;p.rot=((p.rot||0)+1)%4;
   if(p._loc==="grid"&&!canPlace(p,p.row,p.col,p.id)){p.rot=old;toast("Não cabe girado aqui.");}
   save();renderGrid();renderBag();}});}}
function buildSwatches(){const b=$("swatches");if(!b)return;
 b.innerHTML=PIECE_COLORS.map(c=>`<div class="sw ${c===editorColor?"sel":""}" style="background:${c}" onclick="pickColor('${c}')"></div>`).join("");}
function pickColor(c){editorColor=c;buildSwatches();}
function buildShapeEditor(){if(!editorShape.length)editorShape=Array.from({length:5},()=>Array(5).fill(false));
 const ed=$("shapeEd");if(!ed)return;ed.innerHTML="";
 for(let r=0;r<5;r++)for(let c=0;c<5;c++){const d=document.createElement("div");
  d.className="sc"+(editorShape[r][c]?" on":"");
  d.onclick=()=>{editorShape[r][c]=!editorShape[r][c];buildShapeEditor();};ed.appendChild(d);}}
function clearShape(){editorShape=Array.from({length:5},()=>Array(5).fill(false));buildShapeEditor();}
function shapeCells(){const cells=[];
 for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(editorShape[r][c])cells.push([r,c]);
 if(!cells.length)return null;
 const mR=Math.min(...cells.map(x=>x[0])),mC=Math.min(...cells.map(x=>x[1]));
 return cells.map(([r,c])=>[r-mR,c-mC]);}
function addPiece(){const name=$("pieceName").value.trim()||"Item";const cells=shapeCells();
 if(!cells){toast("Desenhe um formato primeiro.");return;}
 S.inv.bag.push({id:S.inv.seq++,name,color:editorColor,shape:cells,rot:0});
 $("pieceName").value="";clearShape();save();renderBag();toast("Item criado na bolsa.");}
function rotateShape(cells){const mR=Math.max(...cells.map(x=>x[0]));
 const rot=cells.map(([r,c])=>[c,mR-r]);
 const nR=Math.min(...rot.map(x=>x[0])),nC=Math.min(...rot.map(x=>x[1]));
 return rot.map(([r,c])=>[r-nR,c-nC]);}
function shapeDims(cells){return[Math.max(...cells.map(x=>x[0]))+1,Math.max(...cells.map(x=>x[1]))+1];}
function effShape(p){let s=p.shape;for(let i=0;i<(((p.rot||0)%4)+4)%4;i++)s=rotateShape(s);return s;}
function renderGrid(){const rows=gridRows(),grid=$("invGrid");if(!grid)return;
 const gi=$("gi");if(gi)gi.textContent=GRID_COLS+" × "+rows;
 grid.style.gridTemplateColumns=`repeat(${GRID_COLS}, ${CSZ}px)`;grid.innerHTML="";
 for(let i=0;i<rows*GRID_COLS;i++){const c=document.createElement("div");c.className="cell";grid.appendChild(c);}
 const step=CSZ+GAP;
 S.inv.pieces.forEach(p=>{const s=effShape(p),[h,w]=shapeDims(s);
  const cont=document.createElement("div");cont.className="piece";
  cont.style.left=(2+p.col*step)+"px";cont.style.top=(2+p.row*step)+"px";
  cont.style.width=(w*CSZ+(w-1)*GAP)+"px";cont.style.height=(h*CSZ+(h-1)*GAP)+"px";
  cont.title=p.name+" (clique e tecle R p/ girar)";cont.dataset.id=p.id;
  s.forEach(([r,c])=>{const cd=document.createElement("div");
   cd.style.cssText=`position:absolute;left:${c*step}px;top:${r*step}px;width:${CSZ}px;height:${CSZ}px;background:${p.color};border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);border-radius:2px`;
   cont.appendChild(cd);});
  const lbl=document.createElement("div");lbl.textContent=p.name;
  lbl.style.cssText="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#0d0b0a;font-weight:700;font-size:9px;text-shadow:0 0 2px rgba(255,255,255,.4);pointer-events:none;padding:2px;text-align:center";
  cont.appendChild(lbl);
  makeDraggable(cont,p,"grid");cont.onclick=()=>{selectedPiece=p;};
  grid.appendChild(cont);});}
function makeDraggable(dom,p,loc){p._loc=loc;
 dom.addEventListener("pointerdown",ev=>{ev.preventDefault();selectedPiece=p;
  const grid=$("invGrid");if(!grid)return;const rect=grid.getBoundingClientRect();
  const cell=grid.querySelector(".cell");const cs=cell?cell.getBoundingClientRect().width:CSZ;
  dragInfo={p,dom,rect,step:cs+GAP};dom.classList.add("dragging");
  document.addEventListener("pointermove",onDrag);document.addEventListener("pointerup",endDrag);});}
function onDrag(ev){if(!dragInfo)return;const{dom}=dragInfo;
 dom.style.position="fixed";dom.style.left=(ev.clientX-15)+"px";dom.style.top=(ev.clientY-15)+"px";dom.style.zIndex=999;}
function endDrag(ev){document.removeEventListener("pointermove",onDrag);document.removeEventListener("pointerup",endDrag);
 if(!dragInfo)return;const{p,rect,step}=dragInfo;
 const col=Math.round((ev.clientX-rect.left-2)/step),row=Math.round((ev.clientY-rect.top-2)/step);
 dragInfo.dom.classList.remove("dragging");dragInfo=null;
 if(ev.clientX>=rect.left&&ev.clientX<=rect.right&&ev.clientY>=rect.top&&ev.clientY<=rect.bottom){
  if(canPlace(p,row,col,p.id)){S.inv.bag=S.inv.bag.filter(x=>x.id!==p.id);
   if(!S.inv.pieces.find(x=>x.id===p.id))S.inv.pieces.push(p);
   p.row=row;p.col=col;}else toast("Não cabe aí.");}
 else{S.inv.pieces=S.inv.pieces.filter(x=>x.id!==p.id);
  if(!S.inv.bag.find(x=>x.id===p.id))S.inv.bag.push(p);}
 save();renderGrid();renderBag();}
function canPlace(p,row,col,ignoreId){const rows=gridRows(),s=effShape(p),occ={};
 S.inv.pieces.forEach(o=>{if(o.id===ignoreId)return;effShape(o).forEach(([r,c])=>occ[(o.row+r)+","+(o.col+c)]=1);});
 for(const[r,c]of s){const rr=row+r,cc=col+c;
  if(rr<0||cc<0||rr>=rows||cc>=GRID_COLS)return false;
  if(occ[rr+","+cc])return false;}
 return true;}
function renderBag(){const bag=$("bag");if(!bag)return;bag.innerHTML="";
 S.inv.bag.forEach(p=>{const s=effShape(p),[h,w]=shapeDims(s);
  const d=document.createElement("div");d.className="bagpiece";
  d.style.width=Math.max(34,w*16)+"px";d.style.height=Math.max(20,h*16)+"px";
  d.style.background=p.color;d.textContent=p.name;d.title=p.name;
  makeDraggable(d,p,"bag");d.onclick=()=>{selectedPiece=p;};
  const wrap=document.createElement("div");wrap.style.cssText="display:flex;flex-direction:column;align-items:center;gap:2px";
  wrap.appendChild(d);
  const del=document.createElement("button");del.className="btn mini del";del.textContent="×";
  del.onclick=()=>{S.inv.bag=S.inv.bag.filter(x=>x.id!==p.id);save();renderBag();};
  wrap.appendChild(del);bag.appendChild(wrap);});}

</script>
